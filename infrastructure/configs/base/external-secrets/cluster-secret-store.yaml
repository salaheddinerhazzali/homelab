apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        appRole:
          path: "approle"
          roleRef:
            name: vault-approle-secrets
            namespace: external-secrets
            key: ROLE_ID
          secretRef:
            name: vault-approle-secrets
            namespace: external-secrets
            key: SECRET_ID