apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  interval: 30m
  chart:
    spec:
      chart: cert-manager
      version: "v1.14.4"
      sourceRef:
        kind: HelmRepository
        name: jetstack
        namespace: cert-manager
  values:
    # Install CRDs via Helm
    installCRDs: true
    
    # Enable webhook for cert validation
    webhook:
      enabled: true
      
    # Prometheus metrics
    prometheus:
      enabled: true
      #servicemonitor:
      #  enabled: false
    
    # Security context
    securityContext:
      runAsNonRoot: true
      fsGroup: 1000
    
    # Resource limits for production
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    
    # Leader election for HA
    leaderElection:
      namespace: cert-manager