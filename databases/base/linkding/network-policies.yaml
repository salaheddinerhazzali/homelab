apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-db
  namespace: linkding
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: linkding-postgres
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: linkding
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: linkding-postgres
  policyTypes:
    - Egress
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-linkding-app
  namespace: linkding
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: linkding-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: linkding
      ports:
        - port: 5432
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgadmin-app
  namespace: linkding
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: linkding-postgres
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: pgadmin
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pgadmin
      ports:
        - port: 5432
          protocol: TCP
