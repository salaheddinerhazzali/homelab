apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: linkding-app-secrets
  namespace: linkding
spec:
  refreshInterval: 30s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: linkding-app-secrets
    creationPolicy: Owner
  dataFrom:
  - extract:
      key: linkding