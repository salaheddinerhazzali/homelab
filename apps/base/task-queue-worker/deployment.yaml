apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-queue-worker
  namespace: task-queue-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-queue-worker
  template:
    metadata:
      labels:
        app: task-queue-worker
    spec:
      imagePullSecrets:
      - name: ghcr-secret   
      containers:
      - name: task-queue-worker
        image: ghcr.io/salaheddinerhazzali/task-queue-worker:main-fe66f40
        ports:
        - containerPort: 8000
          name: http